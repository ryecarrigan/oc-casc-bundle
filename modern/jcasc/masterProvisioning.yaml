masterProvisioning:
  dockerImageDefinitionConfiguration:
    images:
    - imageTag: "cloudbees/cloudbees-core-mm:${v2609a}"
      name: "CloudBees CI - Managed Controller - ${v2609a}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2608}"
      name: "CloudBees CI - Managed Controller - ${v2608}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2607}"
      name: "CloudBees CI - Managed Controller - ${v2607}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2606}"
      name: "CloudBees CI - Managed Controller - ${v2606}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2605}"
      name: "CloudBees CI - Managed Controller - ${v2605}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2604}"
      name: "CloudBees CI - Managed Controller - ${v2604}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2603}"
      name: "CloudBees CI - Managed Controller - ${v2603}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2602}"
      name: "CloudBees CI - Managed Controller - ${v2602}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2601}"
      name: "CloudBees CI - Managed Controller - ${v2601}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2512}"
      name: "CloudBees CI - Managed Controller - ${v2512}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2511}"
      name: "CloudBees CI - Managed Controller - ${v2511}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2510}"
      name: "CloudBees CI - Managed Controller - ${v2510}"
    - imageTag: "cloudbees/cloudbees-core-mm:${v2509}"
      name: "CloudBees CI - Managed Controller - ${v2509}"
  kubernetes:
    cpus: "1.5"
    disk: "50"
    fsGroup: "1000"
    memory: "4096"
    nodeSelectors: "jenkins=controller"
    yaml: |
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: ^${name}-secrets
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: jenkins-secrets
      subjects:
      - kind: ServiceAccount
        name: ^${name}
